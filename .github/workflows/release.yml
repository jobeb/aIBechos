name: Release

# Publica en GitHub Releases al pushear un tag v* (p. ej. v1.8.8):
# compila Windows (portable + instalador Inno), macOS (dmg) y Linux
# (tar.gz) y los adjunta a la Release. Los workflows build-*.yml
# manuales se mantienen para probar builds sin publicar.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aIBechos
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Leer versión de core/version.py
        id: version
        run: |
          $v = (Get-Content core/version.py -Raw | Select-String '__version__ = "(.*?)"').Matches[0].Groups[1].Value
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Compilar con PyInstaller
        run: |
          if (Test-Path dist\aIBechos) { Remove-Item -Recurse -Force dist\aIBechos }
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          python -m PyInstaller --noconfirm aIBechos.spec

      - name: Generar instalador Inno Setup
        run: |
          if (Test-Path installer_output) { Remove-Item -Recurse -Force installer_output }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' setup.iss

      - name: Comprimir portable
        run: |
          Compress-Archive -Path dist\aIBechos -DestinationPath "aIBechos_${{ steps.version.outputs.version }}_windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: aIBechos-windows
          path: |
            aIBechos/installer_output/aIBechos_Setup_*.exe
            aIBechos/aIBechos_*_windows.zip

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: aIBechos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar con PyInstaller
        run: pyinstaller aIBechos.spec

      - name: Leer versión de core/version.py
        id: version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('core/version.py', encoding='utf-8').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Empaquetar en DMG
        run: |
          mkdir dmg_root
          cp -R dist/aIBechos.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname aIBechos -srcfolder dmg_root -ov -format UDZO "aIBechos_${{ steps.version.outputs.version }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: aIBechos-macos
          path: aIBechos/aIBechos_${{ steps.version.outputs.version }}.dmg

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aIBechos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema (librerías que carga Qt al analizar PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0

      - name: Instalar dependencias
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar con PyInstaller
        run: pyinstaller aIBechos.spec

      - name: Leer versión de core/version.py
        id: version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('core/version.py', encoding='utf-8').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Empaquetar en tar.gz
        run: |
          cp aIBechos.desktop IconoSinFondo.png dist/aIBechos/
          tar -C dist -czf "aIBechos_${{ steps.version.outputs.version }}_linux.tar.gz" aIBechos

      - uses: actions/upload-artifact@v4
        with:
          name: aIBechos-linux
          path: aIBechos/aIBechos_${{ steps.version.outputs.version }}_linux.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # Glob recursivo: los artefactos conservan subcarpetas
          # (el Setup.exe de Windows baja a installer_output/) y
          # "dist-artifacts/*" no cruza directorios -- con ese patrón
          # la v1.8.8 salió sin instalador.
          files: |
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.zip
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.tar.gz
          generate_release_notes: true
          body: |
            ## aIBechos ${{ github.ref_name }}

            ### Novedades
            - Archivos: nuevo botón "Eliminar" con uno o varios archivos seleccionados (también la tecla Supr). Pregunta una sola vez para toda la selección y ofrece borrar del disco, del servidor o de los dos según dónde esté cada archivo; siempre los quita de la lista.
            - Recomendado: una serie que ya está en el servidor pero tiene huecos ofrece "Siguiente (TxE)" en vez de "Piloto (1x01)", y "Ocultar ya en el servidor" solo oculta las series completas.
            - Descargas: el juez IA de aMule vuelve a funcionar (fallaba siempre y se descargaba sin revisar). Las series se buscan por su año de estreno, así que ya no se cuela otra versión con el mismo nombre (p. ej. Hunter x Hunter 1999 en vez de 2011).
            - Descargas: los subtítulos en inglés (HorribleSubs, SubsPlease…) cuentan como VOS, se detecta mejor el italiano y se penalizan los archivos sin idioma declarado.
            - Modo automático: un archivo con temporada y episodio (1x05, S01E05) ya no se identifica como película.
            - La app busca actualizaciones cada 6 horas, no solo al abrirse, y Ajustes tiene un botón "Buscar actualizaciones".
            - Estadísticas: el historial de actividad se guarda 90 días, así que "Subidas en los últimos 30 días" vuelve a cubrir el mes entero.
            - Liberar espacio: el año ya no sale dos veces en el título, y se avisa (⚠) cuando el año del nombre no coincide con el de la ficha.

            ### Instalación
            - **Windows**: `aIBechos_Setup_*.exe` (instalador) o `aIBechos_*_windows.zip` (portable).
            - **macOS**: `aIBechos_*.dmg` (sin firmar: clic derecho → Abrir la primera vez).
            - **Linux**: `aIBechos_*_linux.tar.gz`.

            Sin firma de código: SmartScreen/Gatekeeper avisarán la primera vez.
