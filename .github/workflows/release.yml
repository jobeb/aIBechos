name: Release

# Publica en GitHub Releases al pushear un tag v* (p. ej. v1.8.8):
# compila Windows (portable + instalador Inno), macOS (dmg) y Linux
# (tar.gz) y los adjunta a la Release. Los workflows build-*.yml
# manuales se mantienen para probar builds sin publicar.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aIBechos
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Leer versión de core/version.py
        id: version
        run: |
          $v = (Get-Content core/version.py -Raw | Select-String '__version__ = "(.*?)"').Matches[0].Groups[1].Value
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Compilar con PyInstaller
        run: |
          if (Test-Path dist\aIBechos) { Remove-Item -Recurse -Force dist\aIBechos }
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          python -m PyInstaller --noconfirm aIBechos.spec

      - name: Prueba de arranque del ejecutable (--smoke-test)
        # Abre el .exe ya compilado en modo prueba (core/smoke_test.py): si
        # falta algo en el paquete (keyring, paramiko, un plugin Qt...) la
        # release se para aquí en vez de publicarse rota.
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:AIBECHOS_SMOKE_OUT = "$PWD\smoke.txt"
          $p = Start-Process -FilePath "dist/aIBechos/aIBechos.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if (Test-Path smoke.txt) { Get-Content smoke.txt }
          if ($p.ExitCode -ne 0) { throw "La prueba de arranque falló (código $($p.ExitCode))" }

      - name: Generar instalador Inno Setup
        run: |
          if (Test-Path installer_output) { Remove-Item -Recurse -Force installer_output }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' setup.iss

      - name: Comprimir portable
        run: |
          Compress-Archive -Path dist\aIBechos -DestinationPath "aIBechos_${{ steps.version.outputs.version }}_windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: aIBechos-windows
          path: |
            aIBechos/installer_output/aIBechos_Setup_*.exe
            aIBechos/aIBechos_*_windows.zip

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: aIBechos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar con PyInstaller
        run: pyinstaller aIBechos.spec

      - name: Leer versión de core/version.py
        id: version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('core/version.py', encoding='utf-8').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prueba de arranque del ejecutable (--smoke-test)
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/aIBechos.app/Contents/MacOS/aIBechos --smoke-test

      - name: Empaquetar en DMG
        run: |
          mkdir dmg_root
          cp -R dist/aIBechos.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname aIBechos -srcfolder dmg_root -ov -format UDZO "aIBechos_${{ steps.version.outputs.version }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: aIBechos-macos
          path: aIBechos/aIBechos_${{ steps.version.outputs.version }}.dmg

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aIBechos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema (librerías que carga Qt al analizar PySide6)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0

      - name: Instalar dependencias
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar con PyInstaller
        run: pyinstaller aIBechos.spec

      - name: Leer versión de core/version.py
        id: version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('core/version.py', encoding='utf-8').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prueba de arranque del ejecutable (--smoke-test)
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/aIBechos/aIBechos --smoke-test

      - name: Empaquetar en tar.gz
        run: |
          cp aIBechos.desktop IconoSinFondo.png dist/aIBechos/
          tar -C dist -czf "aIBechos_${{ steps.version.outputs.version }}_linux.tar.gz" aIBechos

      - uses: actions/upload-artifact@v4
        with:
          name: aIBechos-linux
          path: aIBechos/aIBechos_${{ steps.version.outputs.version }}_linux.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # Glob recursivo: los artefactos conservan subcarpetas
          # (el Setup.exe de Windows baja a installer_output/) y
          # "dist-artifacts/*" no cruza directorios -- con ese patrón
          # la v1.8.8 salió sin instalador.
          files: |
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.zip
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.tar.gz
          generate_release_notes: true
          body: |
            ## aIBechos ${{ github.ref_name }}

            ### Novedades
            - Actualización automática: las versiones nuevas se descargan e instalan solas (sin preguntar), cuando no hay subidas en marcha; con la ventana abierta avisa 30 s antes de reiniciar. Se puede desactivar en Ajustes → General. Funciona a partir de esta versión: desde la 2.1.0 hay que actualizar a mano una última vez.
            - Archivos: poner un nombre a mano ("Usar este nombre exacto") y un solo diálogo "Corregir identificación" que vuelve a identificar el archivo al editar lo detectado.
            - Archivos: los nombres ya no llevan comillas tipográficas de TMDB.
            - Especiales: la temporada 0 y el episodio 0 se respetan (antes "S00E05" se renombraba 1x05 y pisaba el capítulo de verdad).
            - Solicitudes web: lo que ya está en el servidor se da por completado sin descargarlo otra vez en aMule (antes llegaba días después como "Omitido: ya existe en el servidor").
            - Solicitudes web: se reconoce una serie aunque Jellyfin/Plex la tenga mal identificada (se mira el nombre de la carpeta).
            - Solicitudes web: un piloto pedido por adelantado espera a que haya fuentes en vez de fallar.
            - Sincronización: si un archivo compartido del servidor no se puede leer, ya no se sobrescribe (reservas, autocompletado ⚡ y Recomendado podían perder los datos de los demás).
            - Fiabilidad: los archivos de datos (procesados del modo automático, pendientes de aligerar, caché de sinopsis) se guardan de forma atómica y un corte ya no los corrompe.
            - FTP: descargas más rápidas y errores del disco local (lleno, archivo bloqueado) que ya no se confunden con fallos del servidor.
            - IA: el análisis de episodios que faltan se hace por tandas (ya no falla con listas largas) y el juez IA recuerda sus veredictos 24 h.
            - Registros: los tokens y claves ya no se escriben en los logs.

            ### Instalación
            - **Windows**: `aIBechos_Setup_*.exe` (instalador) o `aIBechos_*_windows.zip` (portable).
            - **macOS**: `aIBechos_*.dmg` (sin firmar: clic derecho → Abrir la primera vez).
            - **Linux**: `aIBechos_*_linux.tar.gz`.

            Sin firma de código: SmartScreen/Gatekeeper avisarán la primera vez.
