name: Tests

# En cada push a main y en cada PR. Corre en Windows porque parte de la
# suite asume ese entorno (rutas C:\, WinRAR/UnRAR, insensibilidad a
# mayúsculas del FS) y porque es la plataforma principal de la app: en
# ubuntu esos tests fallan por el entorno, no por el código. Instala
# requirements-dev.txt (= requirements.txt + pytest + pyflakes + pytest-qt)
# porque parte de los tests importa la interfaz (PySide6) y
# core/media_server_refresh (plexapi): instalar solo requests/keyring rompía
# la recolección con ModuleNotFoundError (visto en CI).
# QT_QPA_PLATFORM=offscreen: los tests de Qt crean widgets sin pantalla.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aIBechos
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --tb=short

      # pyflakes NO importa el módulo, solo lo parsea -- red de seguridad
      # estática además de pytest: pilló tres NameError reales de un tirón
      # (un `lambda` que leía la variable de un `except ... as e` después
      # de que Python la borrara, en el aviso de fallo al mover/borrar el
      # original tras subir).
      # Solo nombres indefinidos: los "imported but unused" son ruido aquí.
      # PowerShell puro (sin grep/||/&&): pwsh no expande globs para
      # comandos nativos y `true` no existe como comando (visto en CI).
      # OJO: el wrapper pwsh de Actions propaga el $LASTEXITCODE del
      # último comando nativo aunque después haya más instrucciones
      # (pyflakes sale 1 si ve cualquier cosa, incluidos "imported but
      # unused" que aquí son ruido): por eso el `exit 0` explícito final.
      - name: Nombres indefinidos (pyflakes)
        run: |
          $files = Get-ChildItem -Path gui_qt, core -Filter *.py -File -Recurse | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem -Path . -Filter *.py -File | Select-Object -ExpandProperty FullName
          $out = & pyflakes $files 2>&1
          $hits = $out | Select-String -Pattern "undefined name"
          if ($hits) { $hits | ForEach-Object { Write-Output $_.Line }; exit 1 }
          Write-Output "sin nombres indefinidos"
          exit 0
