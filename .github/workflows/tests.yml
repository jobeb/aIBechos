name: Tests

# En cada push a main y en cada PR. Instala requirements-dev.txt
# (= requirements.txt + pytest + pyflakes): parte de los tests importa
# gui/app.py y core/media_server_refresh (plexapi), así que instalar
# solo requests/keyring rompe la recolección con ModuleNotFoundError
# (visto en CI). python3-tk + xvfb porque customtkinter necesita tkinter
# presente y, por si algún test futuro instancia widgets, display
# virtual (xvfb-run) en el runner sin entorno gráfico.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aIBechos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema (Tk + display virtual)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar tests
        run: xvfb-run -a python -m pytest tests/ -q --tb=short

      # pyflakes NO importa el módulo, solo lo parsea -- red de seguridad
      # estática además de pytest: pilló tres NameError reales de un tirón
      # (un `lambda` que leía la variable de un `except ... as e` después
      # de que Python la borrara, en el aviso de fallo al mover/borrar el
      # original tras subir).
      # Solo nombres indefinidos: los "imported but unused" son ruido aquí.
      - name: Nombres indefinidos (pyflakes)
        run: |
          pyflakes gui/*.py core/*.py *.py > pyflakes.txt || true
          grep "undefined name" pyflakes.txt && exit 1 || echo "sin nombres indefinidos"
